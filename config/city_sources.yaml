# ================================================================= HOW THE WORKFLOW USES THIS FILE
usage:
  - "For each city, loop micro_markets: query Google News RSS with '<park name> + lease|campus|opens|cafeteria' (tpl in sources.yaml)."
  - "Scrape the gcc_trackers weekly feeds filtered by city. Treat recent_events_seen as seed leads: confirm with a source URL + evidence snippet."
  - "Map each company to its park, then to its caterer (client logos, press) to decide direct vs caterer-led approach."
  - "Industrial clusters and institutions_seed are for onsite warewashing and kitchen design; give them their own segment tags."
  - "Mark any URL that fails check_sources as dead. Never bypass a captcha/login."
