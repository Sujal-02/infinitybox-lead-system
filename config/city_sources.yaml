# config/city_sources.yaml  (saved from the pasted "cities.yaml"; the code's own config/cities.yaml has a different format, so this is a separate file)
# City-level sources and micro-markets for Bengaluru, Pune, Mumbai, Gurugram (+ Noida under NCR).
# Pairs with sources.yaml (national sources). Same keys:
#   n=name  u=url  a=access (rss|api|fetch|apify|manual|agg)  p=priority (h/m/l)
#   v=1 seen live while researching, v=0 from general knowledge, NOT yet checked
#   x=note   dev=developer/owner   seen=tenants/events named in a source I read
# Park and tenant names are starting points. Run check_sources and verify before using as a lead.

# ================================================================= SHARED (all four cities)
shared:
  gcc_trackers:           # Live feeds of new GCC centres and expansions, usually with city + date
    - {n: GCC Index (weekly intel, city pages, event feed), u: "https://gccindex.in/insights", a: fetch, p: h, v: 1, x: "City pages: Bengaluru, Pune, Mumbai, NCR. CSV/PDF are paid"}
    - {n: GCC Index blog (running announcement list), u: "https://gccindex.in/blog/gcc-india-expansion-news", a: fetch, p: h, v: 1}
    - {n: Flexiple GCC lists (India, Bengaluru, Delhi NCR), u: "https://flexiple.com/global-capability-centers/list-of-global-capability-centers-in-india", a: fetch, p: h, v: 1, x: "Also has /list-of-global-capability-centers-in-bengaluru and -in-delhi-ncr pages"}
    - {n: HRKatha (expansion news), u: "https://www.hrkatha.com/expansion", a: fetch, p: m, v: 1, x: "Inaugurations, often name the tech park"}
    - {n: Ceipal new GCC roundup, u: "https://www.ceipal.com/resources/new-gccs-in-india-who-launched-whos-expanding-and-whos-coming-next-2024-2026", a: fetch, p: l, v: 1}
    - {n: Zinnov, u: "https://zinnov.com", a: manual, p: m, v: 0}
    - {n: NASSCOM, u: "https://nasscom.in", a: manual, p: m, v: 0}
  lease_transaction_data: # Registration records show who leased how much, where, and rent
    - {n: CRE Matrix, u: "https://www.crematrix.com", a: fetch, p: h, v: 1, x: "Property registration data on leases (e.g. Wipro, Airoli). Strong 'lease' trigger"}
    - {n: The Realty Today, u: "https://therealtytoday.com", a: fetch, p: m, v: 1, x: "Republishes CRE Matrix lease stories"}
  office_reports: ["CBRE India", "JLL India", "Colliers India", "Cushman & Wakefield India", "Knight Frank India", "Anarock", "Savills India", "Vestian"]   # URLs in sources.yaml
  reits:
    embassy: {u: "https://www.embassyofficeparks.com", x: "Bengaluru (Manyata, Tech Village, Golf Links, Tech Square), Pune, Mumbai, Noida", v: 0}
    mindspace: {u: "https://www.mindspacereit.com", x: "Mumbai (Airoli, Malad), Pune (Kharadi, Yerwada), Hyderabad", v: 0}
    brookfield: {u: "https://www.brookfieldindiareit.com", x: "Candor TechSpace (Gurugram, Noida), Powai Mumbai", v: 0}
  ask: "REIT investor decks list top tenants per asset, leasing activity and buildings under construction. Pull each quarter."

