# config/sources.yaml
# Source registry for the InfinityBox lead workflow.
#
# Keys: n=name  u=url  t=trigger types it can feed  a=access  p=priority (h/m/l)
#       v=1 means the URL was seen live while researching, v=0 means from general
#       knowledge and NOT yet checked. x=note.
# Access: rss | api | fetch (Firecrawl ok) | apify | manual (human clicks) | agg (third-party aggregator)
# Triggers: new_campus, lease, cafeteria_revamp, tender, caterer_renewal,
#           esg_plastic, facilities_hiring, growth
#
# Run `python -m src.run check_sources` first: HEAD/GET every url, write status to
# a Sources tab, mark dead ones. Treat every v:0 as a lead to verify, not a fact.
# Portal terms vary. Read robots.txt/ToS per site; if scraping is not allowed, set a: manual.

# ---------------------------------------------------------------- 1. NEWS (best first feed)
news:
  google_news_rss:
    # One generic feed covers most outlets. Use "site:" to target a publisher.
    tpl: "https://news.google.com/rss/search?q={q}+when:{days}d&hl=en-IN&gl=IN&ceid=IN:en"
    v: 0
    x: "Free, no key. Dedupe by link. Redirect links need resolving to the real article."
  google_alerts:
    - {n: Google Alerts (deliver to RSS), u: "https://www.google.com/alerts", a: manual, p: m, v: 0, x: "Set up once per query, feed URL into the sheet"}
  query_bank:   # {city} from config/cities.yaml; add tech park names per city too
    new_campus:
      - '"new campus" {city} office inaugurates'
      - '"global capability centre" {city} opens OR inaugurates OR expands'
      - 'GCC {city} "new centre" employees seats'
      - '"sq ft" office {city} lease signs'
      - '"campus" {city} "seats" "tech park" new building'
    lease:
      - 'office lease {city} "sq ft" tech company'
      - 'pre-leasing {city} tech park'
      - 'REIT {city} tenant "sq ft" new lease'
    cafeteria_revamp:
      - 'cafeteria OR canteen OR "food court" {city} corporate revamp OR launch'
      - '"workplace experience" {city} new office cafeteria'
      - 'office reopening {city} cafeteria'
    caterer_renewal:
      - 'caterer wins contract {city} corporate cafeteria'
      - 'Sodexo OR Compass OR Aramark OR Elior {city} contract corporate'
      - '"food services" contract {city} campus'
    esg_plastic:
      - '"single-use plastic" {city} corporate OR campus OR cafeteria'
      - '"zero waste" campus {city} company'
      - '"plastic neutral" OR "plastic free" office India company'
      - 'BRSR "single-use plastic" target'
      - 'EPR plastic company India campus'
    facilities_hiring:
      - '"facilities head" OR "head of facilities" {city} appoints'
      - '"workplace" head appoints {city} GCC'
    growth:
      - '{city} company funding headcount "hiring" 1000 employees new office'
      - 'IT company expands {city} new development centre'
    institution:
      - 'new hospital {city} beds inaugurated'
      - 'university new campus {city} hostel mess'
      - 'manufacturing plant {city} inaugurated employees canteen'

  # Publishers to target with site: in Google News RSS (no per-site RSS needed).
  outlets:
    - {n: ET Realty, u: "realty.economictimes.indiatimes.com", t: [new_campus, lease], p: h, v: 0}
    - {n: ET CIO (GCC news), u: "cio.economictimes.indiatimes.com", t: [new_campus, growth], p: h, v: 0}
    - {n: ET HRWorld (office/workplace), u: "hr.economictimes.indiatimes.com", t: [facilities_hiring, cafeteria_revamp], p: m, v: 0}
    - {n: ET HealthWorld, u: "health.economictimes.indiatimes.com", t: [growth], p: m, v: 0, x: "hospital openings"}
    - {n: ET HospitalityWorld, u: "hospitality.economictimes.indiatimes.com", t: [caterer_renewal], p: l, v: 0}
    - {n: Economic Times, u: "economictimes.indiatimes.com", t: [new_campus, esg_plastic], p: h, v: 0}
    - {n: Business Standard, u: "business-standard.com", t: [new_campus, esg_plastic], p: m, v: 0}
    - {n: Mint, u: "livemint.com", t: [new_campus, growth], p: m, v: 0}
    - {n: The Hindu BusinessLine, u: "thehindubusinessline.com", t: [new_campus, lease], p: m, v: 0}
    - {n: Financial Express, u: "financialexpress.com", t: [new_campus, lease], p: m, v: 0}
    - {n: Moneycontrol, u: "moneycontrol.com", t: [new_campus, growth], p: m, v: 0}
    - {n: Hindustan Times, u: "hindustantimes.com", t: [new_campus], p: m, v: 0, x: "NCR and Pune coverage"}
    - {n: Times of India city pages, u: "timesofindia.indiatimes.com", t: [new_campus], p: m, v: 0}
    - {n: Deccan Herald, u: "deccanherald.com", t: [new_campus], p: m, v: 0, x: "Bangalore"}
    - {n: The Hindu, u: "thehindu.com", t: [new_campus], p: m, v: 0, x: "Bangalore, Hyderabad"}
    - {n: Telangana Today, u: "telanganatoday.com", t: [new_campus], p: m, v: 0, x: "Hyderabad"}
    - {n: The Hans India, u: "thehansindia.com", t: [new_campus], p: l, v: 0, x: "Hyderabad"}
    - {n: Pune Mirror / Pune Times Mirror, u: "punemirror.com", t: [new_campus], p: l, v: 0}
    - {n: Inc42, u: "inc42.com", t: [growth], p: m, v: 0}
    - {n: Entrackr, u: "entrackr.com", t: [growth], p: m, v: 1, x: "funding and filings"}
    - {n: YourStory, u: "yourstory.com", t: [growth], p: l, v: 1}
    - {n: Track2Realty, u: "track2realty.com", t: [lease, new_campus], p: m, v: 0}
    - {n: Hotelier India, u: "hotelierindia.com", t: [caterer_renewal], p: l, v: 0}
    - {n: Restaurant India, u: "restaurantindia.in", t: [caterer_renewal], p: l, v: 0}
    - {n: Franchise India, u: "franchiseindia.com", t: [growth], p: l, v: 0}
    - {n: Packaging South Asia, u: "packagingsouthasia.com", t: [esg_plastic], p: l, v: 1, x: "also where InfinityBox is covered"}
    - {n: WhatPackaging, u: "whatpackaging.co.in", t: [esg_plastic], p: l, v: 1}
    - {n: Waste & Recycling Mag, u: "wasterecyclingmag.com", t: [esg_plastic], p: l, v: 1}
    - {n: PIB (govt press releases), u: "pib.gov.in", t: [esg_plastic], p: l, v: 0}

# ---------------------------------------------------------------- 2. TENDERS
tenders:
  keywords: [canteen, cafeteria, catering services, mess, "dish washing", dishwashing, housekeeping,
             "kitchen equipment", "commercial kitchen", "hospital kitchen", "dietary services",
             crockery, "food court", "pantry", "utensil"]
  portals:
    - {n: GeM (bids), u: "https://bidplus.gem.gov.in/all-bids", t: [tender], a: fetch, p: h, v: 0, x: "May need captcha/JS; if blocked, use aggregators or manual"}
    - {n: GeM home, u: "https://gem.gov.in", t: [tender], a: manual, p: m, v: 0}
    - {n: CPPP (central), u: "https://eprocure.gov.in/eprocure/app", t: [tender], a: manual, p: h, v: 1, x: "Search has captcha; do not bypass"}
    - {n: Karnataka KPPP, u: "https://kppp.karnataka.gov.in/", t: [tender], a: fetch, p: h, v: 1, x: "Bangalore"}
    - {n: Telangana eProc, u: "https://tender.telangana.gov.in/", t: [tender], a: fetch, p: h, v: 1, x: "Hyderabad"}
    - {n: MahaTenders, u: "https://mahatenders.gov.in/nicgep/app", t: [tender], a: fetch, p: h, v: 1, x: "Pune"}
    - {n: Delhi govt procurement, u: "https://govtprocurement.delhi.gov.in", t: [tender], a: fetch, p: h, v: 0, x: "NCR"}
    - {n: Haryana eTenders, u: "https://etenders.hry.gov.in", t: [tender], a: fetch, p: m, v: 0, x: "Gurugram / NCR"}
    - {n: UP eTender, u: "https://etender.up.nic.in", t: [tender], a: fetch, p: m, v: 0, x: "Noida / Greater Noida"}
    - {n: CPWD, u: "https://eprocure.gov.in", t: [tender], a: manual, p: l, v: 0, x: "Central buildings, mostly via CPPP"}
    - {n: IREPS (railways), u: "https://www.ireps.gov.in", t: [tender], a: manual, p: l, v: 0, x: "Catering/housekeeping at stations; low fit"}
  aggregators:   # Mirror the portals, no captcha, but check each site's terms before scraping
    - {n: Tender18, u: "https://www.tender18.com/all-india-tenders/department-tenders/etender-tenders", t: [tender], a: agg, p: m, v: 1}
    - {n: InfraLens BidEasy, u: "https://tenders.infralens.in", t: [tender], a: agg, p: m, v: 1, x: "Lists the portals it mirrors and closing dates"}
    - {n: TenderTiger, u: "https://www.tendertiger.com", t: [tender], a: agg, p: l, v: 0}
    - {n: Tender247, u: "https://www.tender247.com", t: [tender], a: agg, p: l, v: 0}
    - {n: TenderDetail, u: "https://www.tenderdetail.com", t: [tender], a: agg, p: l, v: 0}
  private_rfps:
    - {n: PSU / bank / large-institution procurement pages, a: manual, p: l, x: "Search '{org} tender canteen' on each org's own site"}

# ---------------------------------------------------------------- 3. JOBS (facilities hiring = new site / new budget)
jobs:
  keywords:
    facilities: ["facility manager", "facilities manager", "head of facilities", "workplace services", "workplace experience", "workplace operations", "admin manager", "administration head", "real estate and facilities", "integrated facility management"]
    food: ["cafeteria manager", "food services manager", "F&B manager", "food and beverage manager corporate", "catering manager", "unit manager canteen", "dietary manager", "kitchen manager"]
    esg: ["sustainability manager", "ESG manager", "sustainability lead", "environment health safety manager"]
    buying: ["procurement manager facilities", "category manager facility", "head of real estate", "project head fit-out", "fit-out manager", "interior project manager"]
  boards:
    - {n: LinkedIn Jobs, a: apify, actor: "worldunboxer/rapid-linkedin-scraper", p: h, v: 0, x: "allowlisted actor; test on 5 records first"}
    - {n: Naukri, u: "https://www.naukri.com", a: manual, p: m, v: 0, x: "Strict ToS; manual search links or Apify only if the actor is allowlisted"}
    - {n: Indeed India, u: "https://in.indeed.com", a: manual, p: m, v: 0}
    - {n: Foundit, u: "https://www.foundit.in", a: manual, p: l, v: 0}
    - {n: Shine, u: "https://www.shine.com", a: manual, p: l, v: 0}
    - {n: Glassdoor India, u: "https://www.glassdoor.co.in", a: manual, p: l, v: 0}
    - {n: Instahyre, u: "https://www.instahyre.com", a: manual, p: l, v: 0}
    - {n: Wellfound, u: "https://wellfound.com", a: manual, p: l, v: 0}
  ats_public_apis:   # Official public job-board endpoints; use these for the company career pages. Cheap and clean.
    - {n: Greenhouse, u: "https://boards-api.greenhouse.io/v1/boards/{token}/jobs", a: api, p: h, v: 0}
    - {n: Lever, u: "https://api.lever.co/v0/postings/{company}?mode=json", a: api, p: h, v: 0}
    - {n: Ashby, u: "https://api.ashbyhq.com/posting-api/job-board/{org}", a: api, p: m, v: 0}
    - {n: SmartRecruiters, u: "https://api.smartrecruiters.com/v1/companies/{id}/postings", a: api, p: m, v: 0}
    - {n: Workday, u: "https://{tenant}.wd{n}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs", a: api, p: h, v: 0, x: "POST with JSON body; most large GCCs use it. Find tenant from the careers URL"}
    - {n: Company careers pages (Firecrawl), a: fetch, p: h, x: "Fallback when no ATS endpoint is known"}

# ---------------------------------------------------------------- 4. ESG / PLASTIC / COMPLIANCE
esg:
  - {n: NSE corporate filings (BRSR), u: "https://www.nseindia.com/companies-listing/corporate-filings-announcements", t: [esg_plastic], a: manual, p: h, v: 0, x: "NSE blocks bots. Download BRSR PDFs by hand or from company IR pages, then parse"}
  - {n: BSE corporate filings, u: "https://www.bseindia.com/corporates/ann.html", t: [esg_plastic, lease], a: fetch, p: h, v: 0, x: "Also catches expansion announcements"}
  - {n: Company IR / sustainability pages, a: fetch, t: [esg_plastic], p: h, x: "Annual report + BRSR PDF; search for 'single-use plastic', 'water', 'cafeteria', 'waste'"}
  - {n: SEBI BRSR framework, u: "https://www.sebi.gov.in", t: [esg_plastic], a: manual, p: l, v: 0, x: "Context: top 1000 listed companies must file BRSR"}
  - {n: Nifty 500 constituents (seed list), u: "https://www.niftyindices.com", t: [esg_plastic], a: manual, p: h, v: 0, x: "Seed account list; BRSR filers"}
  - {n: CPCB EPR plastic portal, u: "https://eprplastic.cpcb.gov.in", t: [esg_plastic], a: manual, p: l, v: 0}
  - {n: CPCB, u: "https://cpcb.nic.in", t: [esg_plastic], a: manual, p: l, v: 0, x: "Plastic waste rules, notices"}
  - {n: State pollution control boards (KSPCB, TSPCB, MPCB, DPCC), a: manual, p: l, x: "Single-use plastic enforcement notices; find current URLs"}
  - {n: SBTi target dashboard, u: "https://sciencebasedtargets.org/target-dashboard", t: [esg_plastic], a: manual, p: m, v: 0, x: "Indian companies with climate targets = ESG pressure"}
  - {n: CDP, u: "https://www.cdp.net", t: [esg_plastic], a: manual, p: l, v: 0}
  - {n: UN Global Compact India, u: "https://www.unglobalcompact.org", t: [esg_plastic], a: manual, p: l, v: 0}
  - {n: India Plastics Pact, u: "https://indiaplasticspact.org", t: [esg_plastic], a: manual, p: m, v: 0, x: "Member companies are pre-sold on plastic reduction"}
  - {n: FSSAI Eat Right Campus, u: "https://eatrightindia.gov.in", t: [cafeteria_revamp], a: manual, p: m, v: 0, x: "Certified campuses care about cafeteria hygiene"}
  - {n: FSSAI FoSCoS (licence search), u: "https://foscos.fssai.gov.in", t: [caterer_renewal], a: manual, p: m, v: 0, x: "Find registered caterers; check portal terms"}

