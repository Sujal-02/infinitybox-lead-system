# ---------------------------------------------------------------- 8. NICHE DIRECTORIES (cafes, caterers, cloud kitchens)
directories:
  - {n: Google Maps (via Apify Google Maps actor, if allowlisted), a: apify, p: h, v: 0, x: "Queries like 'corporate catering {city}', 'cafeteria contractor {city}', 'cloud kitchen {area}'"}
  - {n: IndiaMART, u: "https://www.indiamart.com", a: manual, p: m, v: 0, x: "Catering / canteen contractors"}
  - {n: TradeIndia, u: "https://www.tradeindia.com", a: manual, p: l, v: 0}
  - {n: Justdial, u: "https://www.justdial.com", a: manual, p: m, v: 0}
  - {n: Sulekha, u: "https://www.sulekha.com", a: manual, p: l, v: 0}
  - {n: Swiggy / Zomato listings, a: manual, p: m, x: "Volume signal for delivery-heavy outlets; ToS restricts scraping"}
  - {n: NRAI, u: "https://nrai.org", a: manual, p: l, v: 0, x: "Member lists, India Food Service reports"}
  - {n: FHRAI, u: "https://www.fhrai.com", a: manual, p: l, v: 0, x: "Hotels/hospitality"}
  - {n: Trade-show exhibitor/visitor lists (food service, hospitality, FM), a: manual, p: m, x: "Search current-year shows per city"}

# ---------------------------------------------------------------- 9. PEOPLE (roles to find per account; names from public pages)
people:
  public_name_sources:
    - "Annual report / BRSR sign-off (sustainability head, CFO, admin leadership)"
    - "Press releases and event speaker pages"
    - "Company 'about' and 'leadership' pages"
    - "Apify people search (allowlisted, no cookies), top N accounts only"
    - "Pre-filled LinkedIn search link for a human (no scraping)"
  email:
    - {n: Hunter (domain search + verifier), u: "https://hunter.io", a: api, p: h, v: 0, x: "Email pattern + verification before any draft is used"}
  roles:
    corporate: [Head of Facilities, Workplace Experience Head, Admin Head, Real Estate Head, Sustainability/ESG Lead, Procurement Head]
    caterer: [City/Regional Operations Head, Procurement Head, Business Head]
    fitout: [Project Head, Fit-out Manager, Facilities Head, Procurement Head]
    institution: [Estate Officer, Registrar/Admin, Hospital Operations Head, Dietary Head]

# ---------------------------------------------------------------- 10. INBOUND (distribution and calculator inputs)
inbound:
  seo_tools:
    - {n: Google Search Console, u: "https://search.google.com/search-console", p: h, v: 0}
    - {n: Google Trends, u: "https://trends.google.com", p: m, v: 0}
    - {n: Google Keyword Planner, u: "https://ads.google.com/home/tools/keyword-planner", p: m, v: 0}
    - {n: "'People also ask' on target queries", a: manual, p: m, x: "Use for SEO page topics"}
  query_ideas: ["cafeteria disposables cost per meal", "BRSR single-use plastic cafeteria", "outsourced dishwashing corporate",
                "central warewashing", "cafeteria hygiene audit checklist", "cafeteria water usage per meal",
                "steel vs disposable plates office canteen", "caterer contract renewal checklist", "kitchen design for office cafeteria"]
  calculator_assumption_sources:   # Cite these on the page for every default value
    - {n: FSSAI (hygiene schedules, Eat Right), u: "https://www.fssai.gov.in", v: 0}
    - {n: CPCB plastic waste data, u: "https://cpcb.nic.in", v: 0}
    - {n: BRSR / BRSR Core water intensity guidance, u: "https://www.sebi.gov.in", v: 0}
    - {n: "Own company claims (use as 'InfinityBox reports'), not as fact", x: "e.g. 40-60% lower water/energy; mark as vendor claim"}
  communities: ["IFMA India chapters", "LinkedIn facility-management and sustainability groups", "Workplace/GCC leader events per city"]
  lead_routing: {corporate: warewashing, institution: warewashing, fitout: kitchen_design, caterer: partner}

# ---------------------------------------------------------------- Rules for the workflow
rules:
  - Never bypass a captcha or login wall. If blocked, set a: manual and move on.
  - Respect robots.txt and each site's terms; set a polite delay and a User-Agent with contact info.
  - Every signal row keeps source_url + verbatim evidence.
  - Prefer official portals/APIs over aggregators, and aggregators over scraping news sites directly.
  - Log per-source yield and precision after each run; demote or drop weak sources.
