name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4        # the public page's calculator is tested with node
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q          # no keys needed: tests use fixtures and never call a paid API
      - name: Page is up to date with its source
        run: |
          python inbound/build.py
          git diff --exit-code inbound/index.html
      - name: Dashboard snapshot page is up to date with the desk
        run: |
          python -m app.export_static --html-only
          git diff --exit-code dashboard/index.html
  secrets-guard:
    # In a PUBLIC repo, fail if a key file or key-shaped string is tracked. (The private share repo may hold .env on purpose.)
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if git ls-files | grep -E '(^|/)(\.env|creds\.json)$'; then echo "key file is tracked"; exit 1; fi
          if git grep -n -I -E 'AIza[0-9A-Za-z_-]{20,}|apify_api_[A-Za-z0-9]{10,}|fc-[a-f0-9]{16,}|-----BEGIN [A-Z ]*PRIVATE KEY' -- . ':!.github'; then echo "key-shaped string found"; exit 1; fi
