name: deploy-inbound-page
on:
  push:
    branches: [main]
    paths: ["inbound/**", "dashboard/**", "app/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:                                  # nothing is published unless the page's tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_inbound.py tests/test_inbound_calc.py
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the public files only (no source, build script or backend)
        run: |
          mkdir _site
          cp -r inbound/index.html inbound/404.html inbound/calc.js inbound/seo inbound/assets _site/
          cp -r dashboard _site/dashboard      # read-only dashboard snapshot, personal details already removed
          test -f _site/dashboard/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
