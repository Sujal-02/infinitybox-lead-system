name: deploy-inbound-page
on:
  push:
    branches: [main]
    paths: ["inbound/**", "dashboard/**", "app/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:                                  # nothing is published unless the page's tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_inbound.py tests/test_inbound_calc.py
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the public files only (no source, build script or backend)
        run: |
          mkdir _site
          cp -r inbound/index.html inbound/404.html inbound/calc.js inbound/seo inbound/assets _site/
          cp -r dashboard _site/dashboard      # read-only dashboard snapshot, personal details already removed
          test -f _site/dashboard/index.html
      - name: Send the public page's enquiries to the Google Sheet (repository variable APPS_SCRIPT_URL; empty = preview mode, nothing stored)
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          if [ -n "$APPS_SCRIPT_URL" ]; then
            echo "$APPS_SCRIPT_URL" | grep -Eq '^https://script\.google\.com/[A-Za-z0-9._/-]+$' || { echo "APPS_SCRIPT_URL must be the https://script.google.com/.../exec address"; exit 1; }
            sed -i "s|APPS_SCRIPT_URL: \"\"|APPS_SCRIPT_URL: \"$APPS_SCRIPT_URL\"|" _site/index.html
            grep -q "$APPS_SCRIPT_URL" _site/index.html
          fi
      - name: Point the dashboard at the hosted server (repository variable API_URL; empty keeps the read-only snapshot)
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            echo "$API_URL" | grep -Eq '^https://[A-Za-z0-9._:/-]+$' || { echo "API_URL must be an https URL"; exit 1; }
            sed -i "s|window.API_BASE = \"\"|window.API_BASE = \"$API_URL\"|" _site/dashboard/index.html
            grep -q "$API_URL" _site/dashboard/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
